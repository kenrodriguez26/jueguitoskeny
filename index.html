<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-In QR Corporativo</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
color:white;
font-family:Arial;
}
.card-custom{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
border-radius:20px;
}
#reader{
width:100%;
border-radius:15px;
overflow:hidden;
}
.success{
background:#16a34a;
}
.error{
background:#dc2626;
}
.pending{
background:#f59e0b;
}
</style>
</head>

<body>

<div class="container py-5">

<div class="text-center mb-4">
<h1 class="fw-bold">CHECK-IN EVENTO</h1>
<p class="text-light">Escaneo QR + Validación Excel</p>
</div>

<div class="row g-4">

<div class="col-lg-6">
<div class="card card-custom p-4">
<h4>Cargar Excel</h4>
<input type="file" id="excelFile" class="form-control mb-3" accept=".xlsx,.xls">

<h4 class="mt-4">Escáner QR</h4>
<div id="reader"></div>
</div>
</div>

<div class="col-lg-6">
<div class="card card-custom p-4">
<h4>Resultado</h4>

<div id="resultado" class="p-4 rounded pending mt-3">
Esperando escaneo...
</div>

<hr>

<h5>Ingresados:</h5>
<ul id="lista" class="list-group mt-3"></ul>

</div>
</div>

</div>
</div>

<script>
let baseDatos = [];
let registrados = {};

document.getElementById('excelFile').addEventListener('change', cargarExcel);

function cargarExcel(e){
const file = e.target.files[0];
const reader = new FileReader();

reader.onload = function(evt){
const data = new Uint8Array(evt.target.result);
const workbook = XLSX.read(data,{type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
baseDatos = XLSX.utils.sheet_to_json(sheet);

alert("Excel cargado correctamente. Registros: " + baseDatos.length);
}

reader.readAsArrayBuffer(file);
}

function buscarQR(codigo){

let persona = baseDatos.find(p => String(p.QR).trim() === codigo.trim());

if(persona){

if(registrados[codigo]){
mostrarDuplicado(persona);
return;
}

registrados[codigo]=true;
mostrarExito(persona);

}else{
mostrarError(codigo);
}

}

function mostrarExito(p){
document.getElementById("resultado").className="p-4 rounded success";
document.getElementById("resultado").innerHTML=`
<h3>✅ Check-In Exitoso</h3>
<b>${p.Nombre}</b><br>
${p.Empresa}<br>
${p.Cargo}<br>
Hora: ${new Date().toLocaleTimeString()}
`;

document.getElementById("lista").innerHTML += `
<li class="list-group-item">
${p.Nombre} - ${p.Empresa}
</li>
`;
}

function mostrarDuplicado(p){
document.getElementById("resultado").className="p-4 rounded error";
document.getElementById("resultado").innerHTML=`
<h3>⚠ Ya Registrado</h3>
<b>${p.Nombre}</b>
`;
}

function mostrarError(codigo){
document.getElementById("resultado").className="p-4 rounded error";
document.getElementById("resultado").innerHTML=`
<h3>❌ QR No válido</h3>
Código: ${codigo}
`;
}

const qr = new Html5Qrcode("reader");

/* USAR CÁMARA TRASERA */
qr.start(
{ facingMode: { exact: "environment" } },
{
fps:10,
qrbox:250
},
(decodedText)=>{
buscarQR(decodedText);
},
(error)=>{}
).catch(err => {

    /* SI NO FUNCIONA exact, prueba environment normal */
    qr.start(
    { facingMode: "environment" },
    {
    fps:10,
    qrbox:250
    },
    (decodedText)=>{
    buscarQR(decodedText);
    },
    (error)=>{}
    );

});
</script>

</body>
</html>
