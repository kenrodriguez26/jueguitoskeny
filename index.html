
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon 3 en Raya Online</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: black; color: white; text-align:center; font-family: Arial; }
.board { display:grid; grid-template-columns:repeat(3,100px); gap:10px; justify-content:center; margin-top:20px;}
.cell { width:100px;height:100px;border:2px solid cyan;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;}
.X { color: cyan; }
.O { color: magenta; }
</style>
</head>
<body>

<h1>NEON 3 EN RAYA ONLINE</h1>

<div class="container">
<div class="row justify-content-center">
<div class="col-4">
<input type="text" id="playerName" class="form-control" placeholder="Tu nombre">
</div>
</div>

<div id="status" class="mt-3">Conectando...</div>

<div class="board" id="board"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const board = document.getElementById("board");
const statusText = document.getElementById("status");
const playerNameInput = document.getElementById("playerName");

let playerSymbol = null;
let gameState = [];
let currentPlayer = "X";

function createBoard() {
  board.innerHTML = "";
  gameState.forEach((cell, i) => {
    const div = document.createElement("div");
    div.classList.add("cell");
    if (cell) {
      div.textContent = cell;
      div.classList.add(cell);
    }
    div.onclick = () => {
      if (playerSymbol === currentPlayer) {
        socket.emit("makeMove", i);
      }
    };
    board.appendChild(div);
  });
}

socket.on("playerAssignment", (symbol) => {
  playerSymbol = symbol;
  statusText.textContent = "Eres el jugador " + symbol;
});

socket.on("spectator", () => {
  statusText.textContent = "Sala llena. Eres espectador.";
});

socket.on("updateGame", (data) => {
  gameState = data.gameState;
  currentPlayer = data.currentPlayer;
  createBoard();

  if (playerSymbol) {
    statusText.textContent = 
      (currentPlayer === playerSymbol ? "Tu turno" : "Turno del rival");
  }
});
</script>

</body>
</html>
