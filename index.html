<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Arcade - 3 en Raya</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font Futurista -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
    background: #000;
    color: white;
}

/* Fondo animado */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

/* Título */
h1 {
    font-weight: 700;
    color: #0ff;
    text-shadow: 0 0 10px #0ff,
                 0 0 20px #0ff,
                 0 0 40px #00f;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #0ff, 0 0 20px #00f; }
    to { text-shadow: 0 0 20px #0ff, 0 0 40px #00f; }
}

.board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 15px;
}

.cell {
    width: 100px;
    height: 100px;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
    cursor: pointer;
    border: 2px solid #0ff;
    box-shadow: 0 0 10px #0ff inset;
    transition: 0.3s;
}

.cell:hover {
    box-shadow: 0 0 20px #0ff;
    transform: scale(1.05);
}

.X {
    color: #0ff;
    text-shadow: 0 0 15px #0ff;
}

.O {
    color: #f0f;
    text-shadow: 0 0 15px #f0f;
}

.win {
    animation: winnerFlash 0.6s infinite alternate;
}

@keyframes winnerFlash {
    from { box-shadow: 0 0 10px #0f0; }
    to { box-shadow: 0 0 30px #0f0; }
}

.status {
    font-size: 1.3rem;
    margin: 15px 0;
    text-shadow: 0 0 10px #0ff;
}

.score-box {
    background: rgba(0,0,0,0.6);
    border: 2px solid #0ff;
    border-radius: 15px;
    padding: 15px;
    box-shadow: 0 0 15px #0ff;
}

.btn-neon {
    border: 2px solid #0ff;
    color: #0ff;
    background: transparent;
    box-shadow: 0 0 10px #0ff;
    transition: 0.3s;
}

.btn-neon:hover {
    background: #0ff;
    color: black;
    box-shadow: 0 0 25px #0ff;
}

@media(max-width: 576px){
    .board {
        grid-template-columns: repeat(3, 80px);
    }
    .cell {
        width: 80px;
        height: 80px;
        font-size: 2rem;
    }
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container text-center mt-4">
    <h1>NEON 3 EN RAYA</h1>

    <div class="row justify-content-center mt-4">
        <div class="col-md-3 col-5 score-box">
            <h5>Jugador X</h5>
            <h2 id="scoreX">0</h2>
        </div>
        <div class="col-md-3 col-5 score-box ms-3">
            <h5>Jugador O</h5>
            <h2 id="scoreO">0</h2>
        </div>
    </div>

    <div class="status" id="status">Turno del Jugador X</div>

    <div class="d-flex justify-content-center">
        <div class="board" id="board"></div>
    </div>

    <div class="mt-4">
        <button class="btn btn-neon me-2" onclick="resetBoard()">Reiniciar Ronda</button>
        <button class="btn btn-neon" onclick="resetScores()">Reiniciar Puntajes</button>
    </div>
</div>

<script>
/* Fondo Reactivo Animado */
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];
for(let i=0;i<80;i++){
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        radius: Math.random()*2,
        dx: (Math.random()-0.5),
        dy: (Math.random()-0.5)
    });
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#0ff";
    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.radius,0,Math.PI*2);
        ctx.fill();
        p.x+=p.dx;
        p.y+=p.dy;
        if(p.x<0||p.x>canvas.width) p.dx*=-1;
        if(p.y<0||p.y>canvas.height) p.dy*=-1;
    });
    requestAnimationFrame(animate);
}
animate();

/* Juego */
const board = document.getElementById("board");
const statusText = document.getElementById("status");
const scoreX = document.getElementById("scoreX");
const scoreO = document.getElementById("scoreO");

let currentPlayer="X";
let gameState=Array(9).fill("");
let scores=JSON.parse(localStorage.getItem("scores")) || {X:0,O:0};
let gameActive=true;

scoreX.textContent=scores.X;
scoreO.textContent=scores.O;

const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function createBoard(){
    board.innerHTML="";
    gameState.forEach((cell,i)=>{
        const div=document.createElement("div");
        div.classList.add("cell");
        div.textContent=cell;
        if(cell) div.classList.add(cell);
        div.onclick=()=>handleClick(i);
        board.appendChild(div);
    });
}

function handleClick(i){
    if(gameState[i]||!gameActive) return;
    gameState[i]=currentPlayer;
    checkWinner();
    currentPlayer=currentPlayer==="X"?"O":"X";
    statusText.textContent="Turno del Jugador "+currentPlayer;
    createBoard();
}

function checkWinner(){
    for(let combo of wins){
        const [a,b,c]=combo;
        if(gameState[a]&&gameState[a]===gameState[b]&&gameState[a]===gameState[c]){
            statusText.textContent="¡Jugador "+gameState[a]+" gana!";
            scores[gameState[a]]++;
            localStorage.setItem("scores",JSON.stringify(scores));
            scoreX.textContent=scores.X;
            scoreO.textContent=scores.O;
            gameActive=false;
            return;
        }
    }
    if(!gameState.includes("")){
        statusText.textContent="¡Empate!";
        gameActive=false;
    }
}

function resetBoard(){
    gameState=Array(9).fill("");
    gameActive=true;
    currentPlayer="X";
    statusText.textContent="Turno del Jugador X";
    createBoard();
}

function resetScores(){
    scores={X:0,O:0};
    localStorage.setItem("scores",JSON.stringify(scores));
    scoreX.textContent=0;
    scoreO.textContent=0;
}

createBoard();
</script>

</body>
</html>
