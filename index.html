<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>3 en Raya Neon</title>

<!-- Google Font Futurista -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background: radial-gradient(circle at top, #0f0f1a, #050510 70%);
  font-family: 'Orbitron', sans-serif;
  color:#fff;
  text-align:center;
  min-height:100vh;
  overflow-x:hidden;
}

/* Glow dinámico de fondo */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background: radial-gradient(circle at 20% 30%, #00f7ff22, transparent 40%),
              radial-gradient(circle at 80% 70%, #ff00c822, transparent 40%);
  animation: bgMove 8s infinite alternate ease-in-out;
  z-index:-1;
}

@keyframes bgMove{
  0%{transform:translateY(0px);}
  100%{transform:translateY(-20px);}
}

.neon-title{
  font-size:2.5rem;
  margin-top:30px;
  color:#00f7ff;
  text-shadow:
    0 0 5px #00f7ff,
    0 0 10px #00f7ff,
    0 0 20px #00f7ff;
  animation:flicker 3s infinite alternate;
}

@keyframes flicker{
  0%{opacity:1;}
  100%{opacity:0.85;}
}

.card-neon{
  background: rgba(20,20,40,0.8);
  backdrop-filter: blur(12px);
  border:1px solid #00f7ff88;
  border-radius:15px;
  padding:20px;
  box-shadow:
    0 0 25px #00f7ff33,
    inset 0 0 15px #00f7ff22;
  transition:0.4s ease;
}

.card-neon:hover{
  box-shadow:
    0 0 35px #00f7ff66,
    inset 0 0 25px #00f7ff33;
}

input{
  background:#111122 !important;
  border:1px solid #00f7ff !important;
  color:#fff !important;
}

input:focus{
  box-shadow:0 0 15px #00f7ff;
  transform:scale(1.02);
}

.btn-neon{
  background: linear-gradient(45deg,#00f7ff,#00c3cc);
  border:none;
  color:#000;
  font-weight:bold;
  letter-spacing:1px;
  text-transform:uppercase;
  box-shadow:0 0 15px #00f7ff55;
}

.btn-neon:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px #00f7ff;
}

.btn-danger{
  box-shadow:0 0 10px #ff0055;
}

#board{
  display:grid;
  grid-template-columns:repeat(3,130px);
  gap:15px;
  justify-content:center;
  margin-top:25px;
}

.cell{
  width:130px;
  height:130px;
  background: linear-gradient(145deg,#0a0a14,#141428);
  border:2px solid #00f7ff;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
  cursor:pointer;
  transition: all 0.25s ease;
  box-shadow:0 0 10px #00f7ff33 inset;
}

.cell:hover{
  transform:scale(1.08) rotateZ(1deg);
  box-shadow:0 0 20px #00f7ff;
}

.X{
  color:#00f7ff;
  text-shadow:0 0 15px #00f7ff;
  animation:pop 0.2s ease;
}

.O{
  color:#ff00c8;
  text-shadow:0 0 15px #ff00c8;
  animation:pop 0.2s ease;
}

@keyframes pop{
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}

.winner{
  animation:winnerGlow 1s infinite alternate;
}

@keyframes winnerGlow{
  0%{box-shadow:0 0 20px #00ff88;}
  100%{box-shadow:0 0 40px #00ff88;}
}

#score{
  font-size:1.2rem;
  margin-top:15px;
  text-shadow:0 0 10px #00f7ff;
}

#status{
  margin-top:10px;
  font-size:1rem;
  color:#ccc;
}

/* Responsive */
@media (max-width:768px){
  #board{
    grid-template-columns:repeat(3,90px);
    gap:10px;
  }
  .cell{
    width:90px;
    height:90px;
    font-size:45px;
  }
  .neon-title{
    font-size:1.8rem;
  }
}

/* Transiciones suaves globales */
*{
  transition: all 0.2s ease-in-out;
}
</style>
</head>
<body>

<div class="container">
  <h1 class="neon-title">3 EN RAYA NEON</h1>

  <div class="card-neon mt-4">
    <div class="row g-3">
      <div class="col-md-5">
        <input id="nameX" class="form-control" placeholder="Nombre Jugador X">
      </div>
      <div class="col-md-5">
        <input id="nameO" class="form-control" placeholder="Nombre Jugador O">
      </div>
      <div class="col-md-2">
        <button onclick="saveNames()" class="btn btn-neon w-100">Guardar</button>
      </div>
    </div>

    <div id="score" class="mt-3"></div>
    <div id="status"></div>
    <div id="board"></div>

    <div class="mt-4">
      <button onclick="resetGame()" class="btn btn-neon me-2">Reiniciar Partida</button>
      <button onclick="resetScore()" class="btn btn-danger">Reiniciar Marcador</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "TU_AUTH_DOMAIN",
  databaseURL: "TU_DATABASE_URL",
  projectId: "TU_PROJECT_ID",
  storageBucket: "TU_STORAGE_BUCKET",
  messagingSenderId: "TU_SENDER_ID",
  appId: "TU_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const gameRef = ref(db,"game");

const board=document.getElementById("board");
const statusText=document.getElementById("status");
const scoreDiv=document.getElementById("score");

let gameState=Array(9).fill("");
let currentPlayer="X";
let playerNames={X:"Jugador X",O:"Jugador O"};
let score={X:0,O:0};

const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

window.saveNames=function(){
  playerNames={
    X:document.getElementById("nameX").value||"Jugador X",
    O:document.getElementById("nameO").value||"Jugador O"
  };
  updateFirebase();
}

function createBoard(){
  board.innerHTML="";
  gameState.forEach((cell,i)=>{
    const div=document.createElement("div");
    div.classList.add("cell");
    div.textContent=cell;
    if(cell) div.classList.add(cell);
    div.onclick=()=>handleClick(i);
    board.appendChild(div);
  });
}

function handleClick(i){
  if(gameState[i]!="") return;
  gameState[i]=currentPlayer;
  if(checkWinner()) return;
  currentPlayer=currentPlayer==="X"?"O":"X";
  updateFirebase();
}

function checkWinner(){
  for(let combo of wins){
    const[a,b,c]=combo;
    if(gameState[a]&&gameState[a]===gameState[b]&&gameState[a]===gameState[c]){
      score[gameState[a]]++;
      highlight(combo);
      statusText.textContent="🏆 "+playerNames[gameState[a]]+" gana!";
      updateFirebase();
      return true;
    }
  }
  if(!gameState.includes("")){
    statusText.textContent="Empate!";
    updateFirebase();
    return true;
  }
  return false;
}

function highlight(combo){
  const cells=document.querySelectorAll(".cell");
  combo.forEach(i=>cells[i].classList.add("winner"));
}

window.resetGame=function(){
  gameState=Array(9).fill("");
  currentPlayer="X";
  updateFirebase();
}

window.resetScore=function(){
  score={X:0,O:0};
  updateFirebase();
}

function updateFirebase(){
  set(gameRef,{gameState,currentPlayer,playerNames,score});
}

onValue(gameRef,(snapshot)=>{
  const data=snapshot.val();
  if(data){
    gameState=data.gameState||gameState;
    currentPlayer=data.currentPlayer||currentPlayer;
    playerNames=data.playerNames||playerNames;
    score=data.score||score;
  }
  createBoard();
  scoreDiv.textContent=
    playerNames.X+" ("+score.X+")  VS  "+playerNames.O+" ("+score.O+")";
  statusText.textContent="Turno de "+playerNames[currentPlayer];
});

createBoard();
</script>

</body>
</html>
