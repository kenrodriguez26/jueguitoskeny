<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ahorcado Neon Online</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background: radial-gradient(circle at top, #0f0f1a, #050510 70%);
  font-family:'Orbitron',sans-serif;
  color:#fff;
  text-align:center;
  min-height:100vh;
  overflow:hidden;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

.neon-title{
  font-size:2.5rem;
  margin-top:30px;
  color:#00f7ff;
  text-shadow:0 0 20px #00f7ff;
}

.card-neon{
  background:rgba(20,20,40,0.9);
  border:1px solid #00f7ff;
  border-radius:15px;
  box-shadow:0 0 20px #00f7ff55;
  padding:20px;
}

.word-display{
  font-size:2rem;
  letter-spacing:10px;
  margin:20px 0;
}

#timer{
  font-size:1.5rem;
  color:#ffcc00;
}

.ranking{
  margin-top:20px;
  text-align:left;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1 class="neon-title">AHORCADO NEON ONLINE</h1>

  <div class="card-neon mt-4">

    <!-- CONFIG INICIAL -->
    <div id="setup">
      <input type="text" id="playerName" class="form-control mb-2" placeholder="Tu nombre">
      <input type="password" id="secretWord" class="form-control" placeholder="Palabra secreta">
      <button onclick="startGame()" class="btn btn-info mt-3">Iniciar Juego</button>
    </div>

    <!-- JUEGO -->
    <div id="game" style="display:none;">
      <div id="timer">Tiempo: 60</div>
      <div class="word-display" id="wordDisplay"></div>
      <div id="hangman"></div>
      <div id="letters"></div>
      <div id="result" class="mt-3"></div>
    </div>

    <!-- RANKING -->
    <div class="ranking">
      <h4>🏆 Ranking Global</h4>
      <ul id="scoreList" class="list-group"></ul>
    </div>

  </div>
</div>

<script type="module">

/* ================= PARTICULAS ================= */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    size:Math.random()*2,
    speed:Math.random()*1
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00f7ff";
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
    p.y+=p.speed;
    if(p.y>canvas.height)p.y=0;
  });
  requestAnimationFrame(animate);
}
animate();

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAd8_1E7UDpGoikvX7XeXLYvotcEiKeoJk",
  authDomain: "en-raya-a5af4.firebaseapp.com",
  databaseURL: "https://en-raya-a5af4-default-rtdb.firebaseio.com",
  projectId: "en-raya-a5af4",
  storageBucket: "en-raya-a5af4.firebasestorage.app",
  messagingSenderId: "678489143176",
  appId: "1:678489143176:web:f1d1101fc44fefe70e6c3d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const scoreRef = ref(db,"ahorcado_scores");

/* ================= JUEGO ================= */
let player="";
let secret="";
let display="";
let attempts=0;
let maxAttempts=6;
let timeLeft=60;
let timerInterval;

const hangmanStates=["","O","O|","O/|","O/|\\","O/|\\ /","O/|\\ / \\"];

window.startGame=function(){
  player=document.getElementById("playerName").value;
  secret=document.getElementById("secretWord").value.toUpperCase();

  if(!player||!secret) return alert("Completa los campos");

  document.getElementById("setup").style.display="none";
  document.getElementById("game").style.display="block";

  display="_".repeat(secret.length);
  updateDisplay();
  createLetters();
  startTimer();
}

function createLetters(){
  const container=document.getElementById("letters");
  container.innerHTML="";
  "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("").forEach(letter=>{
    const btn=document.createElement("button");
    btn.className="btn btn-outline-light m-1";
    btn.textContent=letter;
    btn.onclick=()=>guess(letter,btn);
    container.appendChild(btn);
  });
}

function guess(letter,btn){
  btn.disabled=true;

  if(secret.includes(letter)){
    let newDisplay="";
    for(let i=0;i<secret.length;i++){
      newDisplay+=secret[i]===letter?letter:display[i];
    }
    display=newDisplay;
  }else{
    attempts++;
  }

  updateDisplay();
  document.getElementById("hangman").textContent=hangmanStates[attempts];
  checkGame();
}

function updateDisplay(){
  document.getElementById("wordDisplay").textContent=
    display.split("").join(" ");
}

function checkGame(){
  if(display===secret){
    endGame(true);
  }
  if(attempts>=maxAttempts){
    endGame(false);
  }
}

function startTimer(){
  timerInterval=setInterval(()=>{
    timeLeft--;
    document.getElementById("timer").textContent="Tiempo: "+timeLeft;
    if(timeLeft<=0){
      endGame(false);
    }
  },1000);
}

function endGame(win){
  clearInterval(timerInterval);
  document.getElementById("letters").innerHTML="";
  const result=document.getElementById("result");

  if(win){
    result.textContent="¡GANASTE!";
    saveScore(10 + timeLeft);
  }else{
    result.textContent="PERDISTE 💀 Palabra: "+secret;
  }
}

/* ================= PUNTUACION ================= */
function saveScore(points){
  const newScoreRef = push(scoreRef);
  set(newScoreRef,{
    name:player,
    points:points
  });
}

onValue(scoreRef,(snapshot)=>{
  const data=snapshot.val();
  const list=document.getElementById("scoreList");
  list.innerHTML="";
  if(data){
    const scores=Object.values(data).sort((a,b)=>b.points-a.points);
    scores.forEach(s=>{
      const li=document.createElement("li");
      li.className="list-group-item bg-dark text-info";
      li.textContent=s.name+" - "+s.points+" pts";
      list.appendChild(li);
    });
  }
});

</script>

</body>
</html>
