<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahorcado Neon Multiplayer</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fuente futurista -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
    background: radial-gradient(circle at center,#0f0f1f,#000);
    color:#0ff;
    font-family:'Orbitron',sans-serif;
    text-align:center;
}
.neon-box{
    background:rgba(0,0,0,0.7);
    border:2px solid #0ff;
    box-shadow:0 0 25px #0ff;
    border-radius:20px;
    padding:30px;
    margin-top:30px;
}
.neon-btn{
    background:#111;
    border:1px solid #0ff;
    color:#0ff;
    box-shadow:0 0 10px #0ff;
    transition:0.3s;
}
.neon-btn:hover{
    transform:scale(1.1);
    box-shadow:0 0 25px #0ff;
}
#wordDisplay{
    font-size:2rem;
    letter-spacing:10px;
}
#hangman{
    font-size:2rem;
    margin:20px;
}
.win-animation{
    animation: glow 1s infinite alternate;
}
@keyframes glow{
    from{ text-shadow:0 0 10px #0ff; }
    to{ text-shadow:0 0 30px #0ff; }
}
</style>
</head>
<body>

<div class="container">

<h1 class="mt-4">🔥 AHORCADO NEON MULTIPLAYER 🔥</h1>

<div id="setup" class="neon-box">
<input type="text" id="playerName" class="form-control mb-3" placeholder="Tu Nombre">
<input type="text" id="secretWord" class="form-control mb-3" placeholder="Palabra Secreta">
<button class="btn neon-btn" onclick="startGame()">INICIAR JUEGO GLOBAL</button>
</div>

<div id="game" class="neon-box" style="display:none;">
<div id="timer">Tiempo: 60</div>
<div id="hangman"></div>
<div id="wordDisplay"></div>
<div id="letters" class="mt-3"></div>
<h3 id="result" class="mt-3"></h3>
</div>

<div class="neon-box">
<h3>🏆 Ranking Global</h3>
<ul id="scoreList" class="list-group"></ul>
</div>

</div>

<!-- FIREBASE + GAME SCRIPT -->
<script type="module">

/* ================= IMPORTS ================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
import { getDatabase, ref, set, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ================= CONFIG ================= */

const firebaseConfig = {
  apiKey: "AIzaSyAd8_1E7UDpGoikvX7XeXLYvotcEiKeoJk",
  authDomain: "en-raya-a5af4.firebaseapp.com",
  databaseURL: "https://en-raya-a5af4-default-rtdb.firebaseio.com",
  projectId: "en-raya-a5af4",
  storageBucket: "en-raya-a5af4.firebasestorage.app",
  messagingSenderId: "678489143176",
  appId: "1:678489143176:web:f1d1101fc44fefe70e6c3d",
  measurementId: "G-P1ZGVDVCKY"
};

/* ================= INIT ================= */

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
const db = getDatabase(app);

const gameRef = ref(db,"ahorcado_game");
const scoreRef = ref(db,"ahorcado_scores");

let player="";
let timerInterval=null;

/* ================= INICIAR GLOBAL ================= */

window.startGame=function(){

  player=document.getElementById("playerName").value;
  const secret=document.getElementById("secretWord").value.toUpperCase();

  if(!player || !secret) return alert("Completa los campos");

  set(gameRef,{
    active:true,
    secretWord:secret,
    display:"_".repeat(secret.length),
    attempts:0,
    timeLeft:60,
    startedBy:player
  });
}

/* ================= ESCUCHAR ================= */

onValue(gameRef,(snapshot)=>{
  const data=snapshot.val();
  if(!data) return;

  if(data.active){

    document.getElementById("setup").style.display="none";
    document.getElementById("game").style.display="block";

    document.getElementById("wordDisplay").textContent=
      data.display.split("").join(" ");

    document.getElementById("hangman").textContent=
      ["","O","O|","O/|","O/|\\","O/|\\ /","O/|\\ / \\"][data.attempts];

    document.getElementById("timer").textContent="Tiempo: "+data.timeLeft;

    if(!timerInterval){
      timerInterval=setInterval(()=>{
        update(gameRef,{
          timeLeft:data.timeLeft-1
        });
      },1000);
    }

    if(data.timeLeft<=0){
      endGame(false,data.secretWord);
    }

    if(data.display===data.secretWord){
      endGame(true,data.secretWord);
    }

  }
});

/* ================= LETRAS ================= */

const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lettersDiv=document.getElementById("letters");

letters.split("").forEach(l=>{
  const btn=document.createElement("button");
  btn.className="btn neon-btn";
  btn.textContent=l;
  btn.onclick=()=>guess(l);
  lettersDiv.appendChild(btn);
});

/* ================= ADIVINAR ================= */

window.guess=function(letter){

  onValue(gameRef,(snapshot)=>{
    const data=snapshot.val();
    if(!data.active) return;

    let newDisplay=data.display;
    let newAttempts=data.attempts;

    if(data.secretWord.includes(letter)){
      let updated="";
      for(let i=0;i<data.secretWord.length;i++){
        updated+=data.secretWord[i]===letter?letter:data.display[i];
      }
      newDisplay=updated;
    }else{
      newAttempts++;
    }

    update(gameRef,{
      display:newDisplay,
      attempts:newAttempts
    });

  },{onlyOnce:true});
}

/* ================= FINAL ================= */

function endGame(win,secret){

  clearInterval(timerInterval);
  timerInterval=null;

  if(win){
    document.getElementById("result").textContent="🎉 GANARON 🎉";
    document.getElementById("result").classList.add("win-animation");
    saveScore(player,20);
  }else{
    document.getElementById("result").textContent="💀 Tiempo agotado - "+secret;
  }

  update(gameRef,{active:false});
}

/* ================= PUNTOS ================= */

function saveScore(name,points){
  const newScore=push(scoreRef);
  set(newScore,{name,points});
}

onValue(scoreRef,(snapshot)=>{
  const data=snapshot.val();
  const list=document.getElementById("scoreList");
  list.innerHTML="";
  if(data){
    const scores=Object.values(data).sort((a,b)=>b.points-a.points);
    scores.forEach(s=>{
      const li=document.createElement("li");
      li.className="list-group-item bg-dark text-info";
      li.textContent=s.name+" - "+s.points+" pts";
      list.appendChild(li);
    });
  }
});

</script>

</body>
</html>
