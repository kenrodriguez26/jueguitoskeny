<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>3 en Raya Online</title>

<style>
body{
  background:#0f0f1a;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  text-align:center;
}

h1{
  margin-top:20px;
}

#players{
  margin:20px;
}

input{
  padding:8px;
  border-radius:5px;
  border:none;
  margin:5px;
}

button{
  padding:10px 15px;
  margin:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

#board{
  display:grid;
  grid-template-columns:repeat(3,120px);
  gap:10px;
  justify-content:center;
  margin-top:20px;
}

.cell{
  width:120px;
  height:120px;
  background:#1a1a2e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  cursor:pointer;
  border-radius:10px;
  transition:0.2s;
}

.cell:hover{
  background:#222244;
}

.X{
  color:#00f7ff;
  animation:pop 0.2s ease;
}

.O{
  color:#ff00c8;
  animation:pop 0.2s ease;
}

@keyframes pop{
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}

.winner{
  animation:flash 0.6s infinite alternate;
}

@keyframes flash{
  from{background:#00ff88;}
  to{background:#004422;}
}

#score{
  margin-top:20px;
  font-size:20px;
}
</style>
</head>
<body>

<h1>3 en Raya Online</h1>

<div id="players">
  <input id="nameX" placeholder="Nombre Jugador X">
  <input id="nameO" placeholder="Nombre Jugador O">
  <button onclick="saveNames()">Guardar Nombres</button>
</div>

<div id="score"></div>
<div id="status">Conectando...</div>

<div id="board"></div>

<button onclick="resetGame()">Reiniciar Partida</button>
<button onclick="resetScore()">Reiniciar Marcador</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAd8_1E7UDpGoikvX7XeXLYvotcEiKeoJk",
  authDomain: "en-raya-a5af4.firebaseapp.com",
  databaseURL: "https://en-raya-a5af4-default-rtdb.firebaseio.com",
  projectId: "en-raya-a5af4",
  storageBucket: "en-raya-a5af4.firebasestorage.app",
  messagingSenderId: "678489143176",
  appId: "1:678489143176:web:f1d1101fc44fefe70e6c3d"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const gameRef = ref(db, "game");

const board = document.getElementById("board");
const statusText = document.getElementById("status");
const scoreDiv = document.getElementById("score");

let gameState = Array(9).fill("");
let currentPlayer = "X";
let playerNames = {X:"Jugador X", O:"Jugador O"};
let score = {X:0, O:0};

const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

window.saveNames = function(){
  const nameX=document.getElementById("nameX").value || "Jugador X";
  const nameO=document.getElementById("nameO").value || "Jugador O";
  playerNames={X:nameX,O:nameO};
  updateFirebase();
}

function createBoard(){
  board.innerHTML="";
  gameState.forEach((cell,i)=>{
    const div=document.createElement("div");
    div.classList.add("cell");
    div.textContent=cell;
    if(cell) div.classList.add(cell);
    div.onclick=()=>handleClick(i);
    board.appendChild(div);
  });
}

function handleClick(i){
  if(gameState[i] !== "") return;

  gameState[i]=currentPlayer;
  if(checkWinner()) return;

  currentPlayer=currentPlayer==="X"?"O":"X";
  updateFirebase();
}

function checkWinner(){
  for(let combo of wins){
    const [a,b,c]=combo;
    if(gameState[a]&&gameState[a]===gameState[b]&&gameState[a]===gameState[c]){
      score[gameState[a]]++;
      highlight(combo);
      statusText.textContent="¡"+playerNames[gameState[a]]+" gana!";
      updateFirebase();
      return true;
    }
  }
  if(!gameState.includes("")){
    statusText.textContent="¡Empate!";
    updateFirebase();
    return true;
  }
  return false;
}

function highlight(combo){
  const cells=document.querySelectorAll(".cell");
  combo.forEach(i=>cells[i].classList.add("winner"));
}

window.resetGame=function(){
  gameState=Array(9).fill("");
  currentPlayer="X";
  updateFirebase();
}

window.resetScore=function(){
  score={X:0,O:0};
  updateFirebase();
}

function updateFirebase(){
  set(gameRef,{
    gameState,
    currentPlayer,
    playerNames,
    score
  });
}

onValue(gameRef,(snapshot)=>{
  const data=snapshot.val();
  if(data){
    gameState=data.gameState||Array(9).fill("");
    currentPlayer=data.currentPlayer||"X";
    playerNames=data.playerNames||playerNames;
    score=data.score||score;
  }
  createBoard();
  statusText.textContent="Turno de "+playerNames[currentPlayer];
  scoreDiv.textContent=
    playerNames.X+" ("+score.X+")  vs  "+playerNames.O+" ("+score.O+")";
});

createBoard();
</script>

</body>
</html>
