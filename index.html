<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Arcade - 3 en Raya Online</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
    background: #000;
    color: white;
}
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}
h1 {
    font-weight: 700;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #00f;
}
.board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 15px;
}
.cell {
    width: 100px;
    height: 100px;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
    cursor: pointer;
    border: 2px solid #0ff;
}
.X { color: #0ff; }
.O { color: #f0f; }
.status {
    font-size: 1.3rem;
    margin: 15px 0;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container text-center mt-4">
<h1>NEON 3 EN RAYA ONLINE</h1>
<div class="status" id="status">Conectando...</div>
<div class="d-flex justify-content-center">
<div class="board" id="board"></div>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 TU CONFIG YA INTEGRADA */
const firebaseConfig = {
  apiKey: "AIzaSyAd8_1E7UDpGoikvX7XeXLYvotcEiKeoJk",
  authDomain: "en-raya-a5af4.firebaseapp.com",
  databaseURL: "https://en-raya-a5af4-default-rtdb.firebaseio.com",
  projectId: "en-raya-a5af4",
  storageBucket: "en-raya-a5af4.firebasestorage.app",
  messagingSenderId: "678489143176",
  appId: "1:678489143176:web:f1d1101fc44fefe70e6c3d",
  measurementId: "G-P1ZGVDVCKY"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const boardRef = ref(db, "neonGame");

const board = document.getElementById("board");
const statusText = document.getElementById("status");

let playerSymbol = Math.random() > 0.5 ? "X" : "O";
let currentPlayer = "X";
let gameState = Array(9).fill("");

const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function createBoard(){
    board.innerHTML="";
    gameState.forEach((cell,i)=>{
        const div=document.createElement("div");
        div.classList.add("cell");
        div.textContent=cell;
        if(cell) div.classList.add(cell);
        div.onclick=()=>handleClick(i);
        board.appendChild(div);
    });
}

function handleClick(i){
    if(gameState[i] || currentPlayer!==playerSymbol) return;
    gameState[i]=playerSymbol;
    currentPlayer = playerSymbol==="X"?"O":"X";
    updateGame();
}

function updateGame(){
    set(boardRef,{
        gameState,
        currentPlayer
    });
}

function checkWinner(){
    for(let combo of wins){
        const [a,b,c]=combo;
        if(gameState[a]&&gameState[a]===gameState[b]&&gameState[a]===gameState[c]){
            statusText.textContent="¡Jugador "+gameState[a]+" gana!";
            return;
        }
    }
    if(!gameState.includes("")){
        statusText.textContent="¡Empate!";
    }
}

onValue(boardRef,(snapshot)=>{
    const data=snapshot.val();
    if(data){
        gameState=data.gameState;
        currentPlayer=data.currentPlayer;
        createBoard();
        checkWinner();
        statusText.textContent="Turno de "+currentPlayer;
    }
});

createBoard();

</script>

</body>
</html>
