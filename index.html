<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>3 en Raya Neon Ultra</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Orbitron',sans-serif;
  background:#050510;
  overflow:hidden;
  color:white;
}

/* Partículas */
#particles{
  position:fixed;
  width:100%;
  height:100%;
  z-index:-1;
}

/* Título */
.neon-title{
  margin-top:25px;
  font-size:2.5rem;
  color:#00f7ff;
  text-shadow:0 0 10px #00f7ff,0 0 30px #00f7ff;
}

/* Card */
.card-neon{
  background:rgba(15,15,30,0.85);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 40px #00f7ff33;
  border:1px solid #00f7ff55;
}

/* Board */
#board{
  display:grid;
  grid-template-columns:repeat(3,140px);
  gap:25px;
  justify-content:center;
  margin-top:25px;
  perspective:1200px;
}

/* Celda base */
.cell{
  position:relative;
  width:140px;
  height:140px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  cursor:pointer;
  transform-style:preserve-3d;
  transition:transform 0.15s ease;
  background:linear-gradient(145deg,#0f0f1a,#151540);
}

/* Shader Glow */
.cell::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:22px;
  padding:2px;
  background:linear-gradient(
    45deg,
    #00f7ff,
    #ff00c8,
    #00ff88,
    #00f7ff
  );
  background-size:400% 400%;
  animation:glowMove 6s linear infinite;
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
}

@keyframes glowMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* Hover glow */
.cell:hover{
  transform:scale(1.08) translateZ(20px);
  box-shadow:0 20px 40px rgba(0,0,0,0.7);
}

/* Letras */
.X{
  color:#00f7ff;
  text-shadow:0 0 20px #00f7ff;
}

.O{
  color:#ff00c8;
  text-shadow:0 0 20px #ff00c8;
}

/* Ganador */
.winner{
  animation:winnerPulse 1s infinite alternate;
}

@keyframes winnerPulse{
  from{box-shadow:0 0 20px #00ff88;}
  to{box-shadow:0 0 50px #00ff88;}
}

/* Popup victoria */
.win-screen{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0);
  font-size:3rem;
  color:#00ff88;
  text-shadow:0 0 30px #00ff88;
  animation:popup 0.6s forwards;
  z-index:10;
}

@keyframes popup{
  to{transform:translate(-50%,-50%) scale(1);}
}

#score{
  margin-top:15px;
  text-shadow:0 0 15px #00f7ff;
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<div class="container text-center">
  <h1 class="neon-title">3 EN RAYA ULTRA</h1>

  <div class="card-neon mt-4">
    <div id="score"></div>
    <div id="status"></div>
    <div id="board"></div>

    <div class="mt-4">
      <button onclick="resetGame()" class="btn btn-info">Reiniciar</button>
    </div>
  </div>
</div>

<!-- Sonidos -->
<audio id="clickSound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@3/tsparticles.bundle.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyAd8_1E7UDpGoikvX7XeXLYvotcEiKeoJk",
  authDomain:"en-raya-a5af4.firebaseapp.com",
  databaseURL:"https://en-raya-a5af4-default-rtdb.firebaseio.com",
  projectId:"en-raya-a5af4",
  storageBucket:"en-raya-a5af4.firebasestorage.app",
  messagingSenderId:"678489143176",
  appId:"1:678489143176:web:f1d1101fc44fefe70e6c3d"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const gameRef=ref(db,"game");

const board=document.getElementById("board");
const statusText=document.getElementById("status");
const scoreDiv=document.getElementById("score");
const clickSound=document.getElementById("clickSound");
const winSound=document.getElementById("winSound");

let gameState=Array(9).fill("");
let currentPlayer="X";
let score={X:0,O:0};

const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function createBoard(){
  board.innerHTML="";
  gameState.forEach((cell,i)=>{
    const div=document.createElement("div");
    div.classList.add("cell");
    div.textContent=cell;
    if(cell) div.classList.add(cell);
    div.onclick=()=>handleClick(i);
    board.appendChild(div);
  });
}

function handleClick(i){
  if(gameState[i]!="") return;
  clickSound.play();
  gameState[i]=currentPlayer;
  if(checkWinner()) return;
  currentPlayer=currentPlayer==="X"?"O":"X";
  updateFirebase();
}

function checkWinner(){
  for(let combo of wins){
    const[a,b,c]=combo;
    if(gameState[a]&&gameState[a]===gameState[b]&&gameState[a]===gameState[c]){
      score[gameState[a]]++;
      highlight(combo);
      showWin(gameState[a]);
      winSound.play();
      updateFirebase();
      return true;
    }
  }
  return false;
}

function highlight(combo){
  const cells=document.querySelectorAll(".cell");
  combo.forEach(i=>cells[i].classList.add("winner"));
}

function showWin(player){
  const div=document.createElement("div");
  div.classList.add("win-screen");
  div.innerText="🏆 JUGADOR "+player+" GANA!";
  document.body.appendChild(div);
  setTimeout(()=>div.remove(),2000);
}

function resetGame(){
  gameState=Array(9).fill("");
  currentPlayer="X";
  updateFirebase();
}

function updateFirebase(){
  set(gameRef,{gameState,currentPlayer,score});
}

onValue(gameRef,(snapshot)=>{
  const data=snapshot.val();
  if(data){
    gameState=data.gameState||gameState;
    currentPlayer=data.currentPlayer||currentPlayer;
    score=data.score||score;
  }
  createBoard();
  scoreDiv.textContent="X("+score.X+") VS O("+score.O+")";
  statusText.textContent="Turno de "+currentPlayer;
});

createBoard();
</script>

<script>
tsParticles.load("particles",{
  particles:{
    number:{value:70},
    color:{value:["#00f7ff","#ff00c8","#00ff88"]},
    move:{enable:true,speed:1},
    size:{value:3},
    opacity:{value:0.7}
  }
});
</script>

</body>
</html>
