<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-In QR Corporativo</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
color:white;
font-family:Arial;
}

.card-custom{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
border-radius:20px;
}

#reader{
width:100%;
min-height:320px;
border-radius:15px;
overflow:hidden;
display:none;
background:#000;
}

.success{background:#16a34a;}
.error{background:#dc2626;}
.pending{background:#f59e0b;}

#bloqueado{
padding:40px;
text-align:center;
border:2px dashed rgba(255,255,255,0.2);
border-radius:15px;
}
</style>
</head>

<body>

<div class="container py-5">

<div class="text-center mb-4">
<h1 class="fw-bold">CHECK-IN EVENTO</h1>
<p class="text-light">Carga Excel + Escaneo QR + Exportar Registrados</p>
</div>

<div class="row g-4">

<!-- IZQUIERDA -->
<div class="col-lg-6">
<div class="card card-custom p-4">

<h4>1. Cargar Excel</h4>
<input type="file" id="excelFile" class="form-control mb-4" accept=".xlsx,.xls">

<h4>2. Cámara QR</h4>

<div id="bloqueado">
📁 Carga primero el archivo Excel
</div>

<div id="reader"></div>

</div>
</div>

<!-- DERECHA -->
<div class="col-lg-6">
<div class="card card-custom p-4">

<h4>Resultado</h4>

<div id="resultado" class="p-4 rounded pending mt-3">
Esperando archivo Excel...
</div>

<hr>

<div class="d-flex justify-content-between align-items-center mb-3">
<h5 class="mb-0">Registrados:</h5>

<button class="btn btn-success btn-sm" onclick="exportarRegistrados()">
Exportar Excel
</button>
</div>

<ul id="lista" class="list-group mt-2"></ul>

</div>
</div>

</div>
</div>

<script>
let baseDatos = [];
let registrados = {};
let listaRegistrados = [];
let scanner = null;

/* ======================
   SUBIR EXCEL
====================== */
document.getElementById("excelFile").addEventListener("change", cargarExcel);

function cargarExcel(e){

const file = e.target.files[0];
if(!file) return;

document.getElementById("resultado").innerHTML = "Cargando Excel...";

const reader = new FileReader();

reader.onload = function(evt){

try{

const data = new Uint8Array(evt.target.result);
const workbook = XLSX.read(data,{type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
baseDatos = XLSX.utils.sheet_to_json(sheet);

document.getElementById("resultado").className="p-4 rounded success mt-3";
document.getElementById("resultado").innerHTML = `
<h4>✅ Excel cargado correctamente</h4>
Registros: ${baseDatos.length}
`;

activarCamara();

}catch(err){

document.getElementById("resultado").className="p-4 rounded error mt-3";
document.getElementById("resultado").innerHTML = `
<h4>❌ Error leyendo Excel</h4>
`;

}

};

reader.readAsArrayBuffer(file);
}

/* ======================
   CAMARA TRASERA
====================== */
function activarCamara(){

document.getElementById("bloqueado").style.display = "none";
document.getElementById("reader").style.display = "block";

scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode:"environment" },
{
fps:10,
qrbox:{ width:250, height:250 }
},
(qrCodeMessage)=>{
buscarQR(qrCodeMessage);
},
(errorMessage)=>{}
).catch(err=>{

scanner.start(
{ facingMode:{ exact:"environment" } },
{
fps:10,
qrbox:{ width:250, height:250 }
},
(qrCodeMessage)=>{
buscarQR(qrCodeMessage);
},
(errorMessage)=>{}
);

});

}

/* ======================
   VALIDAR QR
====================== */
function buscarQR(codigo){

let persona = baseDatos.find(
p => String(p.QR).trim() === codigo.trim()
);

if(persona){

if(registrados[codigo]){
mostrarDuplicado(persona);
return;
}

registrados[codigo] = true;

/* guardar en exportación */
listaRegistrados.push({
Nombre: persona.Nombre || "",
Empresa: persona.Empresa || "",
Cargo: persona.Cargo || "",
QR: codigo,
Hora: new Date().toLocaleString()
});

mostrarExito(persona);

}else{
mostrarError(codigo);
}

}

/* ======================
   EXPORTAR EXCEL
====================== */
function exportarRegistrados(){

if(listaRegistrados.length === 0){
alert("No hay registrados para exportar.");
return;
}

const ws = XLSX.utils.json_to_sheet(listaRegistrados);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "Registrados");

XLSX.writeFile(wb, "Registrados_Checkin.xlsx");
}

/* ======================
   MENSAJES
====================== */
function mostrarExito(p){

document.getElementById("resultado").className="p-4 rounded success mt-3";
document.getElementById("resultado").innerHTML = `
<h3>✅ Check-In Exitoso</h3>
<b>${p.Nombre}</b><br>
${p.Empresa}<br>
${p.Cargo}<br>
Hora: ${new Date().toLocaleTimeString()}
`;

document.getElementById("lista").innerHTML += `
<li class="list-group-item">
${p.Nombre} - ${p.Empresa}
</li>
`;
}

function mostrarDuplicado(p){

document.getElementById("resultado").className="p-4 rounded error mt-3";
document.getElementById("resultado").innerHTML = `
<h3>⚠ Ya Registrado</h3>
<b>${p.Nombre}</b>
`;
}

function mostrarError(codigo){

document.getElementById("resultado").className="p-4 rounded error mt-3";
document.getElementById("resultado").innerHTML = `
<h3>❌ QR No válido</h3>
Código: ${codigo}
`;
}

</script>

</body>
</html>
