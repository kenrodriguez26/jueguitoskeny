<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Check-In QR Corporativo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
:root{
--black:#0f0f0f;
--black-soft:#171717;
--beige:#d8cbb8;
--beige-soft:#f3eee8;
--white:#ffffff;
--gray:#bdbdbd;
--success:#1f7a4d;
--danger:#a02828;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Montserrat',sans-serif;
background:linear-gradient(145deg,#0a0a0a,#141414,#1c1c1c);
color:var(--white);
min-height:100vh;
}

.main-wrap{
padding:30px 15px;
}

.app-box{
max-width:1300px;
margin:auto;
}

.header-box{
text-align:center;
margin-bottom:28px;
}

.logo-space{
width:110px;
height:110px;
margin:auto;
border:2px dashed rgba(255,255,255,.15);
border-radius:22px;
display:flex;
align-items:center;
justify-content:center;
font-size:13px;
color:var(--gray);
margin-bottom:18px;
background:rgba(255,255,255,.02);
}

.title{
font-size:2rem;
font-weight:800;
letter-spacing:1px;
margin-bottom:8px;
}

.subtitle{
color:#d6d6d6;
font-size:.95rem;
font-weight:500;
}

.card-ui{
background:rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:26px;
backdrop-filter:blur(10px);
box-shadow:0 12px 30px rgba(0,0,0,.25);
height:100%;
}

.section-title{
font-size:1rem;
font-weight:700;
margin-bottom:14px;
color:var(--beige);
letter-spacing:.4px;
}

.form-control{
background:#fff;
border:none;
border-radius:14px;
padding:14px;
font-weight:600;
font-size:.95rem;
}

.form-control:focus{
box-shadow:0 0 0 3px rgba(216,203,184,.25);
border:none;
}

.btn-ui{
border:none;
padding:13px 20px;
border-radius:14px;
font-weight:700;
font-size:.92rem;
transition:.25s ease;
letter-spacing:.3px;
}

.btn-export{
background:linear-gradient(135deg,var(--beige),#f0e4d3);
color:#111;
}

.btn-export:hover{
transform:translateY(-2px);
opacity:.95;
}

#reader{
width:100%;
min-height:320px;
border-radius:18px;
overflow:hidden;
display:none;
background:#000;
}

#bloqueado{
padding:40px 20px;
border:1px dashed rgba(255,255,255,.15);
border-radius:18px;
text-align:center;
color:#d2d2d2;
background:rgba(255,255,255,.02);
}

.status-box{
padding:20px;
border-radius:18px;
font-weight:600;
line-height:1.6;
background:#2a2a2a;
}

.success{background:var(--success);}
.error{background:var(--danger);}
.pending{background:#705b34;}

.list-group-item{
border:none;
border-bottom:1px solid rgba(0,0,0,.06);
padding:14px;
font-weight:600;
font-size:.92rem;
}

.list-group{
border-radius:18px;
overflow:hidden;
}

.small-muted{
font-size:.85rem;
color:#dadada;
}

@media(max-width:991px){
.title{
font-size:1.7rem;
}
.card-ui{
padding:20px;
}
}

@media(max-width:576px){
.main-wrap{
padding:20px 12px;
}
.logo-space{
width:90px;
height:90px;
font-size:11px;
}
.title{
font-size:1.20rem;
}
.subtitle{
font-size:.88rem;
}
.btn-ui{
width:100%;
margin-top:10px;
}
.top-mobile{
display:block !important;
}
}
</style>
</head>

<body>

<div class="main-wrap">
<div class="app-box">

<!-- HEADER -->
<div class="header-box">
<div>
<img src="https://tattersalleventos.com.ar/images/logo.png" style="width: 200px; height: auto; margin: 5%;">
</div>

<div class="title">CHECK-IN EVENTO</div>
<div class="subtitle">Sistema de acceso</div>
</div>

<div class="row g-4">

<!-- IZQUIERDA -->
<div class="col-lg-6">
<div class="card-ui">

<div class="section-title">1. Cargar base de datos Excel</div>

<input type="file" id="excelFile" class="form-control mb-4" accept=".xlsx,.xls">

<div class="section-title">2. Escáner QR</div>

<div id="bloqueado">
Carga primero el archivo Excel para habilitar la cámara trasera.
</div>

<div id="reader"></div>

</div>
</div>

<!-- DERECHA -->
<div class="col-lg-6">
<div class="card-ui">

<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 top-mobile">
<div class="section-title m-0">Resultado</div>

<button class="btn-ui btn-export" onclick="exportarRegistrados()">
Exportar registrados
</button>
</div>

<div id="resultado" class="status-box pending">
Esperando archivo Excel...
</div>

<hr class="border-secondary my-4">

<div class="d-flex justify-content-between align-items-center mb-2">
<div class="section-title m-0">Ingresados</div>
<div class="small-muted" id="contador">0 personas</div>
</div>

<ul id="lista" class="list-group mt-3"></ul>

</div>
</div>

</div>
</div>
</div>

<script>
let baseDatos = [];
let registrados = {};
let listaRegistrados = [];
let scanner = null;

/* ===========================
   CARGAR EXCEL
=========================== */
document.getElementById("excelFile").addEventListener("change", cargarExcel);

function cargarExcel(e){

const file = e.target.files[0];
if(!file) return;

setEstado("Cargando archivo Excel...", "pending");

const reader = new FileReader();

reader.onload = function(evt){

try{

const data = new Uint8Array(evt.target.result);
const workbook = XLSX.read(data,{type:'array'});
const sheet = workbook.Sheets[workbook.SheetNames[0]];
baseDatos = XLSX.utils.sheet_to_json(sheet);

setEstado("✅ Excel cargado correctamente<br>Registros: " + baseDatos.length,"success");

activarCamara();

}catch(error){
setEstado("❌ Error al leer el archivo Excel","error");
}

};

reader.readAsArrayBuffer(file);
}

/* ===========================
   CAMARA TRASERA
=========================== */
function activarCamara(){

document.getElementById("bloqueado").style.display="none";
document.getElementById("reader").style.display="block";

scanner = new Html5Qrcode("reader");

scanner.start(
{ facingMode:"environment" },
{
fps:10,
qrbox:{width:250,height:250}
},
(texto)=>{
buscarQR(texto);
},
(error)=>{}
).catch(()=>{

scanner.start(
{ facingMode:{ exact:"environment"} },
{
fps:10,
qrbox:{width:250,height:250}
},
(texto)=>{
buscarQR(texto);
},
(error)=>{}
);

});

}

/* ===========================
   BUSCAR QR
=========================== */
function buscarQR(codigo){

let persona = baseDatos.find(
p => String(p.QR).trim() === codigo.trim()
);

if(persona){

if(registrados[codigo]){
setEstado("⚠ Ya registrado<br><b>"+persona.Nombre+"</b>","error");
return;
}

registrados[codigo] = true;

listaRegistrados.push({
Nombre: persona.Nombre || "",
Empresa: persona.Empresa || "",
Cargo: persona.Cargo || "",
QR: codigo,
Hora: new Date().toLocaleString()
});

setEstado(
"✅ Check-In exitoso<br><b>"+persona.Nombre+"</b><br>"+(persona.Empresa || "")+"<br>"+(persona.Cargo || ""),
"success"
);

document.getElementById("lista").innerHTML += `
<li class="list-group-item">
${persona.Nombre} - ${persona.Empresa || ""}
</li>
`;

actualizarContador();

}else{

setEstado("❌ QR no válido<br>Código: "+codigo,"error");

}

}

/* ===========================
   EXPORTAR
=========================== */
function exportarRegistrados(){

if(listaRegistrados.length === 0){
alert("No hay registrados.");
return;
}

const ws = XLSX.utils.json_to_sheet(listaRegistrados);
const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, "Registrados");

XLSX.writeFile(wb,"Registrados_Checkin.xlsx");
}

/* ===========================
   UI
=========================== */
function setEstado(html,tipo){

const box = document.getElementById("resultado");
box.className = "status-box " + tipo;
box.innerHTML = html;

}

function actualizarContador(){
document.getElementById("contador").innerText =
listaRegistrados.length + " personas";
}
</script>

</body>
</html>
